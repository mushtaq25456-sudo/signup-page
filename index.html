<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        :root {
            --bg: #f3efe7;
            --card: #ffffff;
            --ink: #1d231f;
            --muted: #6c726d;
            --line: #d9d4c8;
            --brand: #1f4d3a;
            --brand-hover: #173a2b;
            --error: #b3382c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 36px 32px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 15px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder {
            color: #a6a99f;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(31, 77, 58, 0.12);
        }

        .field.has-error input {
            border-color: var(--error);
        }

        .field.has-error input:focus {
            box-shadow: 0 0 0 3px rgba(179, 56, 44, 0.12);
        }

        #password {
            padding-right: 64px;
        }

        .toggle {
            position: absolute;
            right: 6px;
            top: 6px;
            height: 32px;
            padding: 0 10px;
            background: none;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--brand);
            cursor: pointer;
        }

        .toggle:hover {
            background: #eef3f0;
        }

        .error-text {
            font-size: 12.5px;
            color: var(--error);
            margin-top: 5px;
        }

        .submit {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .submit:hover {
            background: var(--brand-hover);
        }

        .submit:disabled {
            background: #c9ccc5;
            cursor: not-allowed;
        }

        @media (max-width: 440px) {
            .card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Create your account</h1>
        <p class="subtitle">Fill in the details below to get started.</p>

        <form id="signupForm" novalidate>
            <div class="field" id="field-email">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
                <div class="error-text" id="err-email"></div>
            </div>

            <div class="field" id="field-password">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
                    <button type="button" class="toggle" id="toggle">Show</button>
                </div>
                <div class="error-text" id="err-password"></div>
            </div>

            <div class="field" id="field-contact">
                <label for="contact">Phone number</label>
                <input type="tel" id="contact" placeholder="03XX XXXXXXX" autocomplete="tel">
                <div class="error-text" id="err-contact"></div>
            </div>

            <button type="submit" class="submit" id="submitbtn">Sign up</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="app.js"></script>
</body>
</html>
